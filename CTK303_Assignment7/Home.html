<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kanto Starter Pokédex</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A mini Pokédex featuring the Kanto starter Pokémon.">
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <header>
        <h1>Kanto Starter Pokédex</h1>
        <p>Choose your first partner.</p>
    </header>

    <main>
        <section class="card-container">

            <article class="card grass">
                <img src="bulbasaur.jpg" alt="Bulbasaur standing with a smile">
                <h2>Bulbasaur</h2>
                <p>Type: Grass / Poison</p>
                <p>Pokédex #: 001</p>
            </article>

            <article class="card fire">
                <img src="charmander.jpg" alt="Charmander with flame on its tail">
                <h2>Charmander</h2>
                <p>Type: Fire</p>
                <p>Pokédex #: 004</p>
            </article>

            <article class="card water">
                <img src="squirtle.jpg" alt="Squirtle smiling with arms open">
                <h2>Squirtle</h2>
                <p>Type: Water</p>
                <p>Pokédex #: 007</p>
            </article>

        </section>
    </main>

    <footer>
        <p>Fan-made educational project. Not affiliated with Nintendo or Pokémon.</p>
    </footer>
</body>
</html>
